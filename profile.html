<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="/">
          <img src="SKR.svg" alt="logo" width="60" />
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="index.html">Main</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="#">Profile</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="signin.html">Sign in</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="registration.html">Registration</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <div class="container mt-5">
      <h1 class="text-center mb-4">Profile</h1>

      <div class="row">
        <!-- Колонка з аватаркою -->
        <div class="col-12 col-md-4 text-center mb-4">
          <img
            src="ava.JPG"
            alt="Kristina"
            width="200"
            class="rounded-circle shadow"
          />
          <div class="mt-3">
            <button class="btn btn-secondary">Редагувати фото</button>
          </div>
        </div>
        <div class="col-12 col-md-8">
          <h4>User Settings</h4>
          <div class="table-responsive">
            <table class="table table-bordered">
              <tbody>
                <tr>
                  <th scope="row">Ім'я</th>
                  <td>
                    <input
                      type="text"
                      class="form-control"
                      placeholder="Крістіна"
                    />
                  </td>
                </tr>
                <tr>
                  <th scope="row">Прізвище</th>
                  <td>
                    <input
                      type="text"
                      class="form-control"
                      placeholder="Швидько"
                    />
                  </td>
                </tr>
                <tr>
                  <th scope="row">Статус</th>
                  <td>
                    <input
                      type="text"
                      class="form-control"
                      placeholder="Студентка"
                    />
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="mt-3">
            <button class="btn btn-secondary w-40 w-md-auto">
              Зберегти зміни
            </button>
          </div>

          <h4 class="mt-4">Contact Settings</h4>
          <div class="table-responsive">
            <table class="table table-bordered">
              <tbody>
                <tr>
                  <th scope="row">Email</th>
                  <td>
                    <input
                      type="text"
                      class="form-control"
                      placeholder="Kristina@gmail.com"
                    />
                  </td>
                </tr>
                <tr>
                  <th scope="row">Телефон</th>
                  <td>
                    <input
                      type="text"
                      class="form-control"
                      placeholder="+380500400300"
                    />
                  </td>
                </tr>
                <tr>
                  <th scope="row">Місто</th>
                  <td>
                    <input
                      type="text"
                      class="form-control"
                      placeholder="Київ"
                    />
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="mt-3">
            <button class="btn btn-secondary w-40 w-md-auto">
              Зберегти зміни
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
