<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link

      crossorigin="anonymous"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="/">
          <img src="SKR.svg" alt="logo" width="60" />
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="index.html">Main</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="profile.html">Profile</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="#">Sign in</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="registration.html">Registration</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <div class="container mt-5 d-flex justify-content-center">
      <div
        class="bg-secondary text-white text-center rounded p-5"
        style="width: 700px; height: 500px; line-height: normal"
      >
        <h1
          class="fw-bold display-4 mb-4"
          style="font-family: &quot;Times New Roman&quot;, Times, serif"
        >
          Welcome back!
        </h1>
        <div class="d-flex justify-content-center">
          <input
            type="text"
            class="form-control w-50 rounded-pill"
            placeholder="Enter Email address.."
            style="height: 40px"
          />
        </div>
        <div class="d-flex justify-content-center mt-3">
          <input
            type="password"
            class="form-control w-50 rounded-pill"
            placeholder="Password"
            style="height: 40px"
          />
        </div>
        <div class="d-flex justify-content-center mt-4">
          <button class="btn btn-dark w-50 rounded-pill" style="height: 45px">
            Log in
          </button>
        </div>
        <button
          class="btn btn-dark w-50 rounded-pill mt-3"
          style="height: 55px"
          onclick="window.location.href = 'registration.html'"
        >
          Register an account
        </button>
      </div>
    </div>
