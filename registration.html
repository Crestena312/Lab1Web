<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AddTelephon</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="/">
          <img src="SKR.svg" alt="logo" width="60" />
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="index.html">Main</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="profile.html">Profile</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="signin.html">Sign in</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="#">Registration</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <div class="container mt-5 d-flex justify-content-center">
      <div
        class="bg-secondary text-white text-center rounded-4 p-4 p-md-5 shadow w-100"
        style="max-width: 900px"
      >
        <h1
          class="fw-bold mb-4"
          style="font-family: &quot;Times New Roman&quot;, Times, serif"
        >
          Create an account!
        </h1>
        <div class="row justify-content-center g-3">
          <div class="col-12 col-md-4">
            <input
              type="text"
              class="form-control rounded-pill"
              placeholder="First name"
              style="height: 40px"
            />
          </div>
          <div class="col-12 col-md-4">
            <input
              type="text"
              class="form-control rounded-pill"
              placeholder="Second name"
              style="height: 40px"
            />
          </div>
        </div>
        <div class="row justify-content-center mt-3">
          <div class="col-12 col-md-8">
            <input
              type="email"
              class="form-control rounded-pill"
              placeholder="Email"
              style="height: 45px"
            />
          </div>
        </div>
        <div class="row justify-content-center mt-3 g-3">
          <div class="col-12 col-md-4">
            <input
              type="text"
              class="form-control rounded-pill"
              placeholder="Password"
              style="height: 40px"
            />
          </div>
          <div class="col-12 col-md-4">
            <input
              type="text"
              class="form-control rounded-pill"
              placeholder="Repeat Password"
              style="height: 40px"
            />
          </div>
        </div>
        <div class="row justify-content-center mt-3 g-3">
          <div class="col-12 col-md-4">
            <input
              type="text"
              class="form-control rounded-pill"
              placeholder="Sex"
              style="height: 40px"
            />
          </div>
          <div class="col-12 col-md-4">
            <input
              type="text"
              class="form-control rounded-pill"
              placeholder="Date of burth"
              style="height: 40px"
            />
          </div>
        </div>
        <div class="d-flex justify-content-center mt-4">
          <div class="col-12 col-md-8">
            <button
              class="btn btn-dark w-50 rounded-pill mt-3"
              style="height: 45px"
            >
              Register account
            </button>
          </div>
        </div>
        <div class="row justify-content-center mt-3">
          <div class="col-12 col-md-8">
            <button
              class="btn btn-dark w-50 rounded-pill mt-3"
              style="height: 45px"
              onclick="window.location.href = 'signin.html'"
            >
              Sign in
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
